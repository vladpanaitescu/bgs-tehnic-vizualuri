<style>
  :root { --bg: #0E1015; --txt: #F2F3F5; --muted: #8E96A6; --acc: #0A3DB3; --acc2: #4C6FFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  header, footer { position: fixed; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 16px; pointer-events: none; }
  header { top: 0; height: calc(56px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); background: linear-gradient(var(--bg) 70%, transparent); }
  footer { bottom: 0; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); justify-content: center; background: linear-gradient(transparent, var(--bg) 35%); }
  .nr { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .info { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .contor { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bara { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--acc2); width: 0; transition: width .2s; }
  .cap { pointer-events: auto; border: 1px solid #2A2F3A; background: #171A21; color: var(--txt); font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .cap span { color: var(--muted); margin-left: 4px; }
  .cap.activ { background: var(--acc); border-color: var(--acc); }
  .cap.activ span { color: #C9D6FF; }
  main { height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  main::-webkit-scrollbar { display: none; }
  .s { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center;
       padding: calc(60px + env(safe-area-inset-top)) 12px calc(68px + env(safe-area-inset-bottom)); }
  .s img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.45); user-select: none; -webkit-user-drag: none; }
  .sag { position: fixed; top: 50%; z-index: 3; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(23,26,33,.85); color: var(--txt); font-size: 22px; cursor: pointer; display: none; }
  .sag.st { left: 16px; } .sag.dr { right: 16px; }
  @media (hover: hover) and (pointer: fine) { .sag { display: block; } }
  .indiciu { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2; color: var(--muted); font-size: 13px; background: rgba(23,26,33,.9); padding: 6px 12px; border-radius: 999px; transition: opacity .6s; pointer-events: none; }
  @media (hover: hover) and (pointer: fine) { .indiciu { display: none; } }
</style>

<script>
  const m = document.getElementById('m'), S = [...document.querySelectorAll('.s')], N = S.length;
  const caps = [...document.querySelectorAll('.cap')];
  let cur = 0;
  const arata = (i) => {
    cur = i; const s = S[i];
    document.getElementById('nr').textContent = s.dataset.n;
    document.getElementById('info').textContent = s.dataset.cap + ' · ' + s.dataset.info;
    document.getElementById('contor').textContent = (i + 1) + ' / ' + N;
    document.getElementById('bara').style.width = ((i + 1) / N * 100) + '%';
    caps.forEach((b) => b.classList.toggle('activ', b.textContent.startsWith(s.dataset.cap)));
    history.replaceState(null, '', '#' + s.dataset.n);
  };
  const du = (i, lin) => { i = Math.max(0, Math.min(N - 1, i)); m.scrollTo({ left: i * m.clientWidth, behavior: lin ? 'auto' : 'smooth' }); };
  let t; m.addEventListener('scroll', () => { const i = Math.round(m.scrollLeft / m.clientWidth); if (i !== cur) arata(i);
    clearTimeout(t); t = setTimeout(() => document.getElementById('indiciu').style.opacity = 0, 400); }, { passive: true });
  caps.forEach((b) => b.addEventListener('click', () => du(S.findIndex((s) => s.dataset.n === b.dataset.la))));
  document.getElementById('st').onclick = () => du(cur - 1);
  document.getElementById('dr').onclick = () => du(cur + 1);
  addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') du(cur + 1); if (e.key === 'ArrowLeft') du(cur - 1); });
  addEventListener('resize', () => du(cur, true));
  const h = decodeURIComponent(location.hash.slice(1)), k = S.findIndex((s) => s.dataset.n === h);
  arata(k > 0 ? k : 0); if (k > 0) requestAnimationFrame(() => du(k, true));
  setTimeout(() => document.getElementById('indiciu').style.opacity = 0, 3500);
</script>
